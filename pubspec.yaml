name: forum
description: 创客次元 Material You 五端客户端
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.8
  dynamic_color: ^1.8.1
  animations: ^2.1.1
  file_picker: ^13.3.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  window_manager: ^0.5.2
  flutter_quill: ^11.6.0
  markdown: ^7.3.1
  markdown_quill: ^4.3.0
  flutter_markdown_plus: ^1.0.7
  socket_io_client: ^3.1.6
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/licenses/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
