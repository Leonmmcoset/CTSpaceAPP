name: Flutter checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  linux:
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf ctspace-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ctspace-linux-x64
          path: ctspace-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: ctspace-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ctspace-windows-x64
          path: build/windows/x64/runner/Release/

  apple:
    runs-on: macos-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign
      - if: matrix.platform == 'macos'
        run: flutter build macos --release
      - if: matrix.platform == 'ios'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ctspace-ios-unsigned.zip
      - if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent 'build/macos/Build/Products/Release/创客次元.app' ctspace-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ctspace-${{ matrix.platform }}
          path: ctspace-*.zip
